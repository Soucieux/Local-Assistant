[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "local-assistant-openclaw-connector"
version = "1.7.0"
description = "Opt-in one-shot SSH connector between Local Assistant and OpenClaw"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "keyring==25.7.0",
  "langgraph==1.2.11",
  "langgraph-checkpoint-sqlite==3.1.1"
]

[project.scripts]
local-assistant-connector = "local_assistant_connector.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/local_assistant_connector"]
